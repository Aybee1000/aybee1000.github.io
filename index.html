<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lagos Island Realtor | Lekki, Ajah, Ibeju Lekki</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:#F8F6F2;color:#111;line-height:1.5}
.top{padding:14px 16px;display:flex;justify-content:space-between;align-items:center;background:#fff;position:sticky;top:0;z-index:20;border-bottom:1px solid #eee}
.logo{font-family:'Playfair Display',serif;font-weight:900;font-size:18px;line-height:1}
.logo small{display:block;font-family:'Inter',sans-serif;font-size:9px;letter-spacing:2px;color:#888;font-weight:700;margin-top:2px}
.top-right{display:flex;gap:10px;align-items:center}
.top-right a{font-size:12px;text-decoration:none;color:#111;font-weight:600}
.top-right .btn{background:#111;color:#fff;padding:8px 14px;border-radius:20px}
.hero{position:relative;margin:12px;border-radius:18px;overflow:hidden;height:380px}
.hero img{width:100%;height:100%;object-fit:cover}
.hero-overlay{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,0.75),rgba(0,0,0,0.1) 60%);padding:18px;display:flex;flex-direction:column;justify-content:flex-end;color:#fff}
.hero-overlay .tag{font-size:10px;letter-spacing:2px;background:rgba(255,255,255,0.2);padding:5px 10px;border-radius:20px;display:inline-block;width:fit-content}
.hero-overlay h1{font-family:'Playfair Display',serif;font-size:30px;line-height:1.1;margin:10px 0 6px}
.hero-overlay p{font-size:13px;color:#ddd}
.price-row{display:flex;justify-content:space-between;align-items:center;margin-top:12px}
.price{font-size:22px;font-weight:800}
.price small{display:block;font-size:11px;color:#ccc;font-weight:400}
.enquire{background:#fff;color:#111;padding:10px 16px;border-radius:20px;text-decoration:none;font-weight:700;font-size:13px}
.search{background:#fff;margin:0 12px 16px;padding:12px;border-radius:14px;display:flex;gap:8px;box-shadow:0 4px 20px rgba(0,0,0,0.06);margin-top:-10px;position:relative;z-index:5}
.search input,.search select{flex:1;padding:12px;border:1px solid #eee;border-radius:10px;font-size:13px;outline:none}
.search button{background:#111;color:#fff;border:none;padding:12px 16px;border-radius:10px;font-weight:700}
.section{padding:10px 16px 20px}
.section h2{font-family:'Playfair Display',serif;font-size:24px}
.section p{color:#666;font-size:13px;margin:4px 0 14px}
.card{background:#fff;border-radius:16px;overflow:hidden;margin-bottom:16px;box-shadow:0 4px 18px rgba(0,0,0,0.05)}
.card img{width:100%;height:180px;object-fit:cover}
.card-body{padding:14px}
.card-body h3{font-size:16px;line-height:1.3}
.card-body p{font-size:12px;color:#666;margin:6px 0}
.card-bottom{display:flex;justify-content:space-between;align-items:center;margin-top:10px}
.card-bottom b{font-size:17px}
.card-bottom a{background:#111;color:#fff;padding:8px 14px;border-radius:20px;text-decoration:none;font-size:12px;font-weight:700}
.about{background:#fff;margin:12px;border-radius:16px;padding:20px;text-align:center}
.about h2{font-family:'Playfair Display',serif;font-size:24px}
.about p{color:#555;font-size:14px;margin:10px 0}
.check{text-align:left;margin-top:14px}
.check b{display:block;margin-top:10px}
.check span{color:#666;font-size:13px}
.btn-green{display:block;background:#25D366;color:#fff;text-align:center;padding:15px;border-radius:12px;text-decoration:none;font-weight:800;margin:12px}
.footer{background:#111;color:#fff;padding:28px 16px;text-align:center}
.footer h3{font-family:'Playfair Display',serif;font-size:22px;letter-spacing:1px}
.footer p{color:#aaa;font-size:13px;margin:8px 0}
.footer a{color:#fff;text-decoration:none;font-weight:700}
</style>
